name: Publish Public Site

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      public_revision: ${{ steps.public-release.outputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL || 'https://treecityrentals.com/' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Verify canonical pages and their shared release
        id: public-release
        env:
          VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL || 'https://treecityrentals.com/' }}
        run: |
          node scripts/check-public-pages.mjs
          node --input-type=module -e 'import { readFileSync, appendFileSync } from "node:fs"; const release = JSON.parse(readFileSync("dist/public-listings.json")); appendFileSync(process.env.GITHUB_OUTPUT, `revision=${release.revision}\n`);'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify production canonical routes after release
        env:
          PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL || 'https://treecityrentals.com/' }}
          PUBLIC_REVISION: ${{ needs.build.outputs.public_revision }}
        run: node scripts/check-public-pages.mjs --url "$PUBLIC_SITE_URL" --revision "$PUBLIC_REVISION" --commit "$GITHUB_SHA"
