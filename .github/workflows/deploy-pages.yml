name: Deploy Application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: application-deploy
  cancel-in-progress: true

jobs:
  backend:
    uses: ./.github/workflows/deploy-supabase-functions.yml
    secrets: inherit

  publish:
    needs: backend
    uses: ./.github/workflows/publish-public-site.yml
